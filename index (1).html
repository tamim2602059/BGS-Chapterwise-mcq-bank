<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1511" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300694c'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23e5484d'/%3E%3C/svg%3E">
<title>বাংলাদেশ ও বিশ্বপরিচয় – কুইজ ব্যাংক</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--paper:#eef3ee;--sheet:#fff;--ink:#10261e;--mute:#587064;--line:#d3dfd7;
--blue:#00694c;--on-blue:#fff;--blue-soft:#dff0e7;
--ok:#0f7d4d;--ok-soft:#dcf2e6;--no:#c8382f;--no-soft:#fde9e6;
--mark:#fff0a6;--up-ink:#2a2410;--rule:rgba(0,105,76,.10);--margin:#e5484d;--shadow:0 1px 0 rgba(16,38,30,.04),0 14px 34px -14px rgba(16,38,30,.30);
--serif:"Noto Serif Bengali","Kalpurush","Noto Sans Bengali",Georgia,serif;
--sans:"Noto Sans Bengali","Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;
--ease:cubic-bezier(.22,.8,.24,1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--paper:#0b1511;--sheet:#121f19;--ink:#e6f0ea;--mute:#93a89c;--line:#223629;
--blue:#4fd19b;--on-blue:#06150e;--blue-soft:#143023;
--ok:#4fd19b;--ok-soft:#133126;--no:#ff8d80;--no-soft:#3a1d1b;
--mark:#4a4216;--up-ink:#f6ecb4;--rule:rgba(79,209,155,.08);--margin:#c4484d;--shadow:0 1px 0 rgba(255,255,255,.03),0 14px 34px -14px rgba(0,0,0,.75)}}
:root[data-theme="dark"]{
--paper:#0b1511;--sheet:#121f19;--ink:#e6f0ea;--mute:#93a89c;--line:#223629;
--blue:#4fd19b;--on-blue:#06150e;--blue-soft:#143023;
--ok:#4fd19b;--ok-soft:#133126;--no:#ff8d80;--no-soft:#3a1d1b;
--mark:#4a4216;--up-ink:#f6ecb4;--rule:rgba(79,209,155,.08);--margin:#c4484d;--shadow:0 1px 0 rgba(255,255,255,.03),0 14px 34px -14px rgba(0,0,0,.75)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::selection{background:var(--blue-soft);color:var(--ink)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;transition:background-color .35s var(--ease),color .35s var(--ease)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
.app{max-width:720px;margin:0 auto;padding:0 16px 48px}
.hide{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 65%,transparent);outline-offset:2px;border-radius:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:1rem;padding:13px 20px;border-radius:12px;background:var(--blue);color:var(--on-blue);transition:transform .18s var(--ease),box-shadow .25s var(--ease),background-color .2s,opacity .2s;box-shadow:0 8px 18px -10px color-mix(in srgb,var(--blue) 80%,transparent)}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 22px -10px color-mix(in srgb,var(--blue) 85%,transparent)}
.btn:active{transform:translateY(0) scale(.985)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--blue);color:var(--blue)}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:.9rem;border-radius:10px}
.btn.sm:not(.ghost){box-shadow:none}
.btn svg{transition:transform .25s var(--ease)}
.btn:hover svg.nx{transform:translateX(3px)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;padding:12px 0;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:1.02rem}
.mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.theme{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .2s,transform .2s var(--ease)}
.theme:hover{box-shadow:inset 0 0 0 1.5px var(--blue)}
.theme:active{transform:scale(.94)}
.theme svg{grid-area:1/1;transition:transform .5s var(--ease),opacity .3s}
.theme .sun{opacity:0;transform:rotate(-90deg) scale(.5)}
.dark-on .theme .sun{opacity:1;transform:none}
.dark-on .theme .moon{opacity:0;transform:rotate(90deg) scale(.5)}

.tools{display:flex;gap:8px;align-items:center}
.ibtn{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .2s,transform .2s var(--ease)}
.ibtn:hover{box-shadow:inset 0 0 0 1.5px var(--blue)}
.ibtn:active{transform:scale(.94)}
.ibtn svg{grid-area:1/1;transition:transform .35s var(--ease),opacity .25s}
.ibtn .x{opacity:0;transform:scale(.5)}
.is-fs .ibtn .e{opacity:0;transform:scale(.5)}
.is-fs .ibtn .x{opacity:1;transform:none}
.nofs .fsb{display:none}
.qt .ibtn{width:34px;height:34px}

/* pages */
.page{animation:pageIn .42s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* hero: an exercise-book page */
.hero{position:relative;margin-top:8px;padding:46px 26px 34px 56px;border-radius:14px;background:
linear-gradient(90deg,transparent 40px,color-mix(in srgb,var(--margin) 75%,transparent) 40px,color-mix(in srgb,var(--margin) 75%,transparent) 41.5px,transparent 41.5px,transparent 44px,color-mix(in srgb,var(--margin) 75%,transparent) 44px,color-mix(in srgb,var(--margin) 75%,transparent) 45.5px,transparent 45.5px),
repeating-linear-gradient(transparent 0,transparent 35px,var(--rule) 35px,var(--rule) 36px),var(--sheet);box-shadow:var(--shadow);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.hero small{display:block;color:var(--mute);font-size:.95rem;font-weight:500}
.hero h1{font-family:var(--serif);font-size:clamp(2.1rem,9vw,3.2rem);line-height:1.5;margin:6px 0 10px;font-weight:700;letter-spacing:-.01em}
.hero p{margin:0 0 22px;max-width:30em;color:var(--mute);line-height:36px}
.omr{display:flex;gap:12px;margin:8px 0 30px}
.bub{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:.95rem;position:relative;overflow:hidden;color:var(--ink)}
.bub::before{content:"";position:absolute;inset:-1px;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .5s var(--ease)}
.bub span{position:relative;transition:color .2s .15s}
.omr.go .bub:nth-child(3)::before{transform:scale(1);transition-delay:.55s;background:var(--blue)}
.omr.go .bub:nth-child(3){border-color:var(--blue)}
.omr.go .bub:nth-child(3) span{color:var(--on-blue);transition-delay:.7s}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat{background:var(--sheet);border-radius:12px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line)}
.stat b{display:block;font-family:var(--serif);font-size:1.7rem;line-height:1.3}
.stat span{color:var(--mute);font-size:.88rem}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--blue-soft);border-radius:12px;padding:14px 16px;color:var(--ink);font-size:.95rem}
.tip svg{flex:none;margin-top:3px;color:var(--blue)}

/* list */
.ph{display:flex;align-items:center;gap:8px;margin:6px 0 8px}
h2{font-family:var(--serif);font-size:1.6rem;line-height:1.5;margin:6px 0 2px}
.mu{color:var(--mute);font-size:.94rem}
.gt{display:flex;align-items:center;gap:12px;margin:28px 2px 8px;font-weight:700;font-size:.98rem;color:var(--ink)}
.gt::after{content:"";flex:1;height:1px;background:var(--line)}
.ch{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border-radius:12px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line);transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
.ch:hover{transform:translateX(3px);box-shadow:inset 0 0 0 1.5px var(--blue)}
.ch:active{transform:scale(.99)}
.num{flex:none;width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:1rem;transition:background-color .25s,color .25s}
.ch:hover .num{background:var(--ink);color:var(--paper)}
.ch.done .num{border-color:var(--ok);color:var(--ok)}
.ch.done:hover .num{background:var(--ok);color:var(--sheet)}
.cb{flex:1;min-width:0}
.cb b{display:block;font-weight:600;line-height:1.5;font-size:.98rem}
.meta{display:flex;align-items:center;gap:10px;margin-top:5px;font-size:.8rem;color:var(--mute)}
.mp{flex:1;max-width:120px;height:5px;background:var(--line);border-radius:5px;overflow:hidden}
.mp i{display:block;height:100%;background:var(--ok);border-radius:5px;transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.bd{font-weight:700;color:var(--ok)}
.ar{flex:none;color:var(--mute);transition:transform .22s var(--ease)}
.ch:hover .ar{transform:translateX(3px);color:var(--blue)}
.mock{margin-top:26px;padding:22px;border-radius:14px;background:var(--ink);color:var(--paper);display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mock b{font-family:var(--serif);font-size:1.15rem;display:block}
.mock span{opacity:.75;font-size:.92rem}
.mock .btn{background:var(--paper);color:var(--ink);box-shadow:none}

/* quiz */
.qt{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding:10px 0 10px;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cap{flex:1;min-width:0;text-align:center;font-weight:600;font-size:.92rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:4px 12px;white-space:nowrap}
.pill.pop{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.18)}}
.pb{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.pb i{display:block;height:100%;width:0;background:var(--blue);border-radius:6px;transition:width .6s var(--ease)}
.count{margin-top:8px;font-size:.88rem;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.sheet{position:relative;margin:12px 0;padding:20px 18px 18px;border-radius:14px;background:var(--sheet);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.sheet.in{animation:qIn .45s var(--ease) both}
@keyframes qIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.up{margin:0 0 16px;padding:12px 14px 12px 16px;border-radius:4px 10px 10px 4px;background:linear-gradient(transparent 0,transparent 0),var(--mark);color:var(--ink);font-size:.97rem;position:relative}
:root:not([data-theme="dark"]) .up{color:#2a2410}
.up::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;background:color-mix(in srgb,var(--ink) 70%,transparent)}
.up b{display:block;font-size:.85rem;margin-bottom:3px}
.q{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px;font-family:var(--serif);font-weight:600;font-size:1.12rem;line-height:1.75}
.n{flex:none;min-width:34px;height:34px;padding:0 8px;border-radius:17px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--sans);font-size:.88rem;font-weight:700;margin-top:3px}
.opts{display:grid;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--sheet);box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden;transition:box-shadow .2s,transform .2s var(--ease),opacity .35s}
.opt::before{content:"";position:absolute;inset:0;transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease);background:transparent;z-index:0}
.opt>*{position:relative;z-index:1}
.opt:not(.lock):hover{box-shadow:inset 0 0 0 1.5px var(--blue);transform:translateX(2px)}
.opt:not(.lock):active{transform:scale(.99)}
.lt{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;font-weight:700;font-size:.92rem;color:var(--mute);transition:background-color .3s,border-color .3s,color .3s,transform .4s var(--ease)}
.opt:not(.lock):hover .lt{border-color:var(--blue);color:var(--blue)}
.lt svg{grid-area:1/1;opacity:0;transform:scale(.4)}
.lt i{grid-area:1/1;font-style:normal;transition:opacity .15s}
.opt.lock{cursor:default}
.opt.dim{opacity:.5}
.opt.ok,.opt.no{opacity:1}
.opt.ok{box-shadow:inset 0 0 0 1.5px var(--ok);color:var(--ink)}
.opt.ok::before{background:var(--ok-soft);transform:scaleX(1)}
.opt.ok .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{box-shadow:inset 0 0 0 1.5px var(--no);animation:nudge .45s var(--ease)}
.opt.no::before{background:var(--no-soft);transform:scaleX(1)}
.opt.no .lt{background:var(--no);border-color:var(--no);color:#fff}
.opt.ok .lt i,.opt.no .lt i{opacity:0}
.opt.ok .lt svg,.opt.no .lt svg{opacity:1;transform:none;transition:opacity .2s .15s,transform .35s var(--ease) .15s}
.opt.ok .lt{transform:scale(1.08)}
@keyframes nudge{20%{transform:translateX(-5px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}}
.fbw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.fbw.open{grid-template-rows:1fr}
.fbw>div{overflow:hidden;min-height:0}
.fbi{padding-top:16px;opacity:0;transform:translateY(8px);transition:opacity .4s .12s,transform .5s var(--ease) .12s}
.fbw.open .fbi{opacity:1;transform:none}
.fb{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-weight:600}
.fb svg{flex:none;margin-top:4px}
.fb.g1{background:var(--ok-soft);color:var(--ok)}
.fb.b1{background:var(--no-soft);color:var(--no)}
.nt{margin:12px 0 14px;padding:12px 14px 12px 16px;border-radius:12px;background:var(--paper);box-shadow:inset 3px 0 0 var(--blue);font-size:.94rem;line-height:1.75}
.nt .tag{display:inline-block;font-size:.76rem;font-weight:700;border-radius:999px;padding:1px 10px;margin:0 8px 4px 0;background:var(--blue);color:var(--on-blue);vertical-align:1px}
.nt .tag.x{background:var(--mute)}
.nt b{display:block;margin-bottom:2px;font-size:.88rem;color:var(--blue)}
.sk{margin-top:10px;width:100%}

/* result */
.res{text-align:center;padding:26px 18px 20px}
.res h2{margin:0 0 4px}
.ringw{position:relative;width:176px;height:176px;margin:20px auto 14px}
.ringw svg{transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:11;stroke-linecap:round}
.ringw .tr{stroke:var(--line)}
.ringw .fg{stroke:var(--blue);stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1.4s var(--ease) .2s,stroke .3s}
.ringw.hi .fg{stroke:var(--ok)}.ringw.lo .fg{stroke:var(--no)}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:2.4rem;line-height:1.2}
.ringc small{font-family:var(--sans);font-size:.85rem;color:var(--mute);font-weight:500}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 20px}
.tl div{padding:12px 4px;border-radius:12px;background:var(--paper)}
.tl b{display:block;font-family:var(--serif);font-size:1.4rem;line-height:1.3}
.tl span{font-size:.82rem;color:var(--mute)}
.tl .a b{color:var(--ok)}.tl .b b{color:var(--no)}
.acts{display:grid;gap:10px}
@media (min-width:640px){.hero{padding:56px 44px 40px 72px}.acts{grid-template-columns:1fr 1fr}.acts .full{grid-column:1/-1}.app{padding-left:24px;padding-right:24px}}
@media (max-width:420px){.hero{padding:38px 18px 28px 54px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>
<body>
<div class="app">
<header class="top" id="nav">
 <div class="brand"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg></span>কুইজ ব্যাংক</div>
 <div class="tools"><button class="ibtn fsb" aria-label="ফুল স্ক্রিন" title="ফুল স্ক্রিন" onclick="fs()"><svg class="e" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg><svg class="x" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg></button><button class="theme" id="tg" aria-label="থিম পরিবর্তন" onclick="tgl()"><svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
</header>

<main>
<section id="home" class="page">
 <div class="hero">
  <small>নবম–দশম শ্রেণি</small>
  <h1>বাংলাদেশ ও বিশ্বপরিচয়</h1>
  <div class="omr" id="omr" aria-hidden="true"><div class="bub"><span>ক</span></div><div class="bub"><span>খ</span></div><div class="bub"><span>গ</span></div><div class="bub"><span>ঘ</span></div></div>
  <div class="cta"><button class="btn" onclick="pg('list')">অধ্যায় বেছে নাও <svg class="nx" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><button class="btn ghost" onclick="mock()">মডেল টেস্ট</button></div>
 </div>
</section>

function rl(){var b=gb(),h="";GR.forEach(function(g){h+='<div class="gt">'+g[0]+'</div>';for(var i=g[1];i<=g[2];i++){var n=QB[i]?QB[i].length:0,v=b[i];h+='<button class="ch'+(v!=null&&v>=80?' done':'')+'" onclick="start('+i+')"><span class="num">'+bn(i)+'</span><div class="cb"><b>'+CH[i-1]+'</b><div class="meta"><span>'+bn(n)+'টি প্রশ্ন</span>'+(v!=null?'<span class="mp"><i style="width:'+v+'%"></i></span><span class="bd">সেরা '+bn(v)+'%</span>':'')+'</div></div>'+IC.ar+'</button>'}});$("cl").innerHTML=h}
function units(b){var u=[];b.forEach(function(q,i){if(q[4]&&i>0&&b[i-1][4]===q[4])u[u.length-1].push(q);else u.push([q])});return u}
function shuf(u){for(var i=u.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=u[i];u[i]=u[j];u[j]=t}return u}
function sh(q){var o=q[1];if(o.every(function(x){return /^(i|ii|iii)(,| ও)/.test(x)})||o.some(function(x){return /সবগুলো|সবকয়টি|সবকটি|কোনোটিই|কোনোটিতেই|উভয়|উপরের/.test(x)}))return q;var c=o[q[2]],a=o.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}var r=q.slice();r[1]=a;r[2]=a.indexOf(c);return r}
function begin(list,n,r){rt=!!r;cp=n;ql=list.map(sh);qi=0;sc=0;done=0;ans=-1;wr=[];$("cap").textContent=rt?"ভুলগুলো শুধরে নাও":n===0?"মডেল টেস্ট":"অধ্যায় "+bn(n);pg("quiz");show()}
function start(n){var b=QB[n];if(!b){return}begin([].concat.apply([],shuf(units(b))),n)}
function mock(){var all=[];for(var k in QB)all=all.concat(units(QB[k]));shuf(all);var out=[];all.forEach(function(u){if(out.length+u.length<=30)out=out.concat(u)});begin(out,0)}
function note(t){var m=/^\[(.+?)\]\s*/.exec(t||"");return m?{tag:m[1],body:t.slice(m[0].length)}:{tag:"",body:t||""}}
function show(){
if(qi>=ql.length){fin();return}
var q=ql[qi],h='<div class="sheet in">'+(q[4]?'<div class="up"><b>উদ্দীপক — পড়ে উত্তর দাও</b>'+q[4]+'</div>':'')+'<div class="q"><span class="n">'+bn(qi+1)+'</span><div>'+q[0]+'</div></div><div class="opts" role="group" aria-label="অপশন">';
q[1].forEach(function(o,j){h+='<button class="opt" id="o'+j+'" type="button" onclick="pk('+j+')"><span class="lt"><i>'+L[j]+'</i></span><span>'+o+'</span></button>'});
h+='</div><div class="fbw" id="fbw"><div><div class="fbi" id="nb"></div></div></div></div>'+(qi<ql.length-1?'<button class="btn ghost sk" id="skb" onclick="sk()">এটা বাদ দিয়ে পরের প্রশ্নে যাও</button>':'');
$("qc").innerHTML=h;ans=-1;
$("sbm").classList.remove("hide");$("pr").textContent="প্রশ্ন "+bn(qi+1)+" / "+bn(ql.length);$("sc").innerHTML=IC.ok.replace(/width="18" height="18"/,'width="13" height="13"')+bn(sc);$("pf").style.width=qi/ql.length*100+"%";window.scrollTo(0,0)}
function sub(){fin()}
function retry(){begin(wr.map(function(w){return w[0]}),cp,1)}
function sk(){if(ans>=0)return;ql.push(ql.splice(qi,1)[0]);show()}
function nxt(){qi++;show()}
function pk(j){
if(ans>=0)return;ans=j;done++;var q=ql[qi],c=q[2],ok=j==c;
for(var k=0;k<q[1].length;k++){var e=$("o"+k);e.classList.add("lock");e.disabled=true;if(k!=c&&k!=j)e.classList.add("dim")}
var ob=$("o"+c);ob.classList.add("ok");ob.querySelector(".lt").insertAdjacentHTML("beforeend",IC.ok);
if(ok)sc++;else{var wb=$("o"+j);wb.classList.add("no");wb.querySelector(".lt").insertAdjacentHTML("beforeend",IC.no);wr.push([q,j])}
var s=$("sc");s.innerHTML=IC.ok.replace(/width="18" height="18"/,'width="13" height="13"')+bn(sc);if(ok){s.classList.remove("pop");void s.offsetWidth;s.classList.add("pop")}
if($("skb"))$("skb").classList.add("hide");
var nt=note(q[3]);
$("nb").innerHTML='<div class="fb '+(ok?'g1':'b1')+'">'+(ok?IC.ok:IC.no)+'<span>'+(ok?'সঠিক উত্তর!':'ভুল! সঠিক উত্তর: '+L[c]+'. '+q[1][c])+'</span></div>'+(nt.body?'<div class="nt"><b>একসাথে জেনে রাখো</b>'+(nt.tag?'<span class="tag'+(nt.tag.indexOf("বোর্ড")>=0?'':' x')+'">'+nt.tag+'</span>':'')+nt.body+'</div>':'<div style="height:12px"></div>')+'<button class="btn block" onclick="nxt()">'+(qi==ql.length-1?"ফলাফল দেখো":"পরের প্রশ্ন")+' '+IC.nx+'</button>';
requestAnimationFrame(function(){requestAnimationFrame(function(){$("fbw").classList.add("open");setTimeout(function(){var e=$("fbw");if(e){var r=e.getBoundingClientRect();if(r.bottom>window.innerHeight-12)window.scrollBy({top:r.bottom-window.innerHeight+24,behavior:RM?"auto":"smooth"})}},320)})})}
function countUp(el,to){if(RM){el.textContent=bn(to)+"%";return}var t0=null;function f(t){if(t0===null)t0=t;var p=Math.min(1,(t-t0)/1300),e=1-Math.pow(1-p,3);el.textContent=bn(Math.round(to*e))+"%";if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function fin(){
var p=Math.round(sc/ql.length*100),m=p>=80?"চমৎকার ফল!":p>=60?"ভালো করেছ, আরও একটু অনুশীলন করো।":"আরও চর্চা দরকার—নোটগুলো আবার পড়ে চেষ্টা করো।";
if(!rt)sb(cp===0?"m":cp,p);$("pf").style.width="100%";$("sbm").classList.add("hide");$("pr").textContent="সম্পন্ন";
$("qc").innerHTML='<div class="sheet in res"><h2>'+(rt?"ভুলগুলো শুধরে নাও":cp===0?"মডেল টেস্ট সম্পন্ন!":"অধ্যায় "+bn(cp)+" সম্পন্ন!")+'</h2><div class="mu">'+m+'</div><div class="ringw '+(p>=80?'hi':p<50?'lo':'')+'" id="rg"><svg width="176" height="176" viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="54"/><circle class="fg" id="rf" cx="60" cy="60" r="54"/></svg><div class="ringc"><span id="rn">০%</span><small>'+bn(sc)+' / '+bn(ql.length)+'</small></div></div><div class="tl"><div class="a"><b>'+bn(sc)+'</b><span>সঠিক</span></div><div class="b"><b>'+bn(done-sc)+'</b><span>ভুল</span></div><div><b>'+bn(ql.length-done)+'</b><span>উত্তরহীন</span></div></div><div class="acts">'+(wr.length?'<button class="btn full" onclick="retry()">ভুলগুলো শুধরে নাও ('+bn(wr.length)+')</button>':'')+'<button class="btn'+(wr.length?' ghost':' full')+'" onclick="'+(cp===0?'mock()':'start('+cp+')')+'">আবার অনুশীলন</button><button class="btn ghost" onclick="back()">'+(cp===0?"হোমে ফিরে যাও":"অন্য অধ্যায়")+'</button></div></div>';
window.scrollTo(0,0);
requestAnimationFrame(function(){requestAnimationFrame(function(){$("rf").style.strokeDashoffset=339.3*(1-p/100);countUp($("rn"),p)})})}
document.addEventListener("keydown",function(e){if($("quiz").classList.contains("hide")||e.ctrlKey||e.metaKey||e.altKey)return;
var k=e.key;if(k=="f"||k=="F"){fs();return}if(ans<0&&/^[1-4]$/.test(k)&&ql&&qi<ql.length){pk(+k-1)}
else if(ans>=0&&(k=="ArrowRight"||k=="n"||k=="N")){nxt()}});
rh();
</script>
